name: http-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  transport-http:
    runs-on: ubuntu-22.04
    env:
      CC: gcc-11
      CXX: g++-11
      BUILD_TYPE: Release

    # Throwaway database for the storage tests - they TRUNCATE every table.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: picasso_test
          POSTGRES_USER: picasso
          POSTGRES_PASSWORD: picasso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picasso -d picasso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-11 g++-11 ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc11-${{ env.BUILD_TYPE }}-${{ hashFiles('conanfile.txt') }}

      - name: Conan install
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${BUILD_TYPE} \
            -s compiler=gcc \
            -s compiler.version=11 \
            -s compiler.libcxx=libstdc++11 \
            -s compiler.cppstd=20

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}

      - name: Build
        run: cmake --build build --target picasso_transport_http_test picasso_storage_test

      - name: Test Transport - HTTP
        run: ctest --test-dir build --output-on-failure -R picasso_transport_http_test

      # unreachable database fails the job rather than passing it silently.
      - name: Test Storage
        env:
          PICASSO_TEST_DB_DSN: "host=127.0.0.1 port=5432 dbname=picasso_test user=picasso password=picasso"
        run: ctest --test-dir build --output-on-failure -R picasso_storage_test
